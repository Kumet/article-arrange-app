services:
  - type: web
    name: ai-article-arranger
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: mock
      - key: SEARCH_PROVIDER
        value: mock
      - key: DATABASE_URL
        value: sqlite:///./app.db
