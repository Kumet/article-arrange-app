<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title or "ai-article-arranger" }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}" />
  </head>
  <body class="min-h-screen bg-neutral-950 text-stone-100">
    <div class="page-shell">
      <header class="mx-auto max-w-6xl px-4 pb-6 pt-6 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between rounded-[1.5rem] border border-white/10 bg-white/[0.04] px-5 py-4 shadow-xl shadow-black/30 backdrop-blur">
          <div>
            <p class="text-xs uppercase tracking-[0.3em] text-stone-500">Workspace</p>
            <h1 class="mt-1 text-lg font-semibold text-white sm:text-xl">AI Article Arranger</h1>
          </div>
          <div class="flex items-center gap-2">
            <a
              href="/prompts"
              class="rounded-2xl border border-white/10 bg-black/20 px-3 py-2 text-xs font-medium text-stone-300 hover:border-white/30 hover:text-white"
            >
              Prompts
            </a>
            <a
              href="/guide"
              class="rounded-2xl border border-white/10 bg-black/20 px-3 py-2 text-xs font-medium text-stone-300 hover:border-white/30 hover:text-white"
            >
              Guide
            </a>
          </div>
        </div>
      </header>
      <main class="mx-auto max-w-6xl px-4 pb-16 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
