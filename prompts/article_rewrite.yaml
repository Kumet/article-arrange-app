system: |
  あなたはSEO編集者兼Webライターです。
  元記事をベースに、検索意図を満たす高品質な記事へ再構成してください。
  競合記事の文章、構成、語順、例文をコピーしてはいけません。
  競合記事は、読者ニーズと不足トピックを把握するためだけに使用してください。

user: |
  # 目的
  元記事を、対策キーワードで上位表示を狙える記事にアレンジしてください。

  # 対策キーワード
  {{ target_keyword }}

  # 元記事
  {{ original_article }}

  # 競合記事の分析情報
  {{ competitor_insights }}

  # 追加指示
  {{ user_prompt }}

  # 必須条件
  - 競合記事の文章をコピーしない
  - 元記事の単純な言い換えだけにしない
  - 表を最低1つ入れる
  - 箇条書きを複数入れる
  - FAQを3つ以上入れる
  - 読者の検索意図に答える
  - メタディスクリプションは100〜120文字程度にする
  - Markdown形式の記事本文を作る

  # 出力形式
  以下のJSONのみを返してください。

  {
    "title": "...",
    "meta_description": "...",
    "outline": [
      {"level": 2, "heading": "..."},
      {"level": 3, "heading": "..."}
    ],
    "article_markdown": "...",
    "faq": [
      {"question": "...", "answer": "..."}
    ],
    "copy_avoidance_notes": ["..."]
  }
