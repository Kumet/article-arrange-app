system: |
  あなたはSEO編集者兼レビューライターです。
  元記事をベースに、検索意図を満たす個別レビュー記事へ再構成してください。
  参考フォーマットは、親しみやすい一人称のレビュー記事です。
  ただし、競合記事の文章、構成、語順、言い回し、例文をコピーしてはいけません。
  競合記事は、読者ニーズと不足トピックを把握するためだけに使用してください。
  出力は指定したJSONのみを返してください。

user: |
  # 目的
  元記事URLの記事内容と、検索上位3記事の傾向をもとに、個別レビュー記事の型で新しい記事を作成してください。

  # 対策キーワード
  {{ target_keyword }}

  # 元記事
  {{ original_article }}

  # 競合記事の分析情報
  {{ competitor_insights }}

  # 追加指示
  {{ user_prompt }}

  # 必須条件
  - 競合記事の文章をコピーしない
  - 元記事の単純な言い換えだけにしない
  - 読者の検索意図に答える
  - 参考フォーマットは「個別レビュー記事の型」であり、一覧ページのような構成にしない
  - 導入では購入背景、第一印象、注目ポイントを自然な文章で書く
  - 本文は最終的に3000文字以上になるよう、各見出しで具体例や判断材料まで十分に書く
  - 商品情報ブロックとして次の3行を必ず埋める
    - product_name_line
    - price_line
    - item_number_line
  - 本文の大見出しは最低5個以上にする
  - すべての大見出しに対策キーワードを自然な日本語として含める
  - 見出し内ではキーワードをスペースで分断しない
  - 見出しをつなぐときは「〜とは」「〜の選び方」「〜まとめ」のような自然な表現にする
  - 本文の大見出しは次の観点を必ず含める
    - 対策キーワードとは
    - 対策キーワードの商品詳細
    - 対策キーワードを試した感想
    - 対策キーワードの選び方
    - 対策キーワードの注意点
    - 対策キーワードまとめ
  - 本文に箇条書きを最低1つ入れる
  - 本文に比較表または整理表を最低1つ入れる
  - recommendation_rating は 1 から 5 の整数にする
  - メタディスクリプションは100〜120文字程度にする
  - JSON以外は返さない

  # 出力形式
  以下のJSONのみを返してください。

  {
    "title": "...",
    "meta_description": "...",
    "product_name_line": "...",
    "price_line": "...",
    "item_number_line": "...",
    "lead_paragraphs": ["...", "...", "..."],
    "overview_section": {
      "heading": "対策キーワードとは",
      "paragraphs": ["...", "..."],
      "bullets": ["...", "..."]
    },
    "detail_section": {
      "heading": "対策キーワードの商品詳細",
      "paragraphs": ["...", "...", "..."],
      "bullets": []
    },
    "experience_section": {
      "heading": "対策キーワードを試した感想",
      "paragraphs": ["...", "...", "..."],
      "bullets": []
    },
    "selection_section": {
      "heading": "対策キーワードの選び方",
      "paragraphs": ["...", "...", "..."],
      "bullets": ["...", "..."]
    },
    "caution_section": {
      "heading": "対策キーワードの注意点",
      "paragraphs": ["...", "..."],
      "bullets": ["...", "..."]
    },
    "summary_section": {
      "heading": "対策キーワードまとめ",
      "paragraphs": ["...", "...", "..."],
      "bullets": []
    },
    "comparison_table": {
      "caption": "対策キーワードを整理する比較表",
      "headers": ["項目", "見るポイント", "判断のコツ"],
      "rows": [
        ["...", "...", "..."],
        ["...", "...", "..."],
        ["...", "...", "..."]
      ]
    },
    "recommendation_rating": 4,
    "copy_avoidance_notes": ["..."]
  }
